<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2 · Cadastro de Comunidades e Aldeias — INITI</title>
<style>
:root{
--bg:#f4f6fa;--panel:#ffffff;--panel2:#f9fafc;--line:#e4e8f0;--line2:#eef1f6;
--ink:#1d2433;--ink2:#5a6577;--muted:#8a93a6;--brand:#1f6b3b;--brand2:#2e8b57;
--accent:#0f5ea8;--gold:#9a6b12;--crit:#c0392b;--warn:#c77c12;--ok:#1f8a4c;--info:#2167a8;
--shadow:0 1px 3px rgba(20,30,50,.06),0 6px 22px rgba(20,30,50,.06);
--r:11px;--font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cfd6e2;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* TOP BAR */
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:11px;min-width:300px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1f6b3b,#2e8b57);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(31,107,59,.35)}
.brand b{font-size:14px;letter-spacing:.2px}.brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:0 14px 0 38px;font-size:13px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand2);background:#fff;box-shadow:0 0 0 3px rgba(46,139,87,.1)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.topbtns{display:flex;align-items:center;gap:8px;margin-left:auto}
.tbtn{height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px;transition:.15s}
.tbtn:hover{border-color:var(--brand2);color:var(--brand)}
.tbtn.primary{background:linear-gradient(135deg,#1f6b3b,#2e8b57);color:#fff;border:none;box-shadow:0 2px 8px rgba(31,107,59,.3)}
.tbtn.primary:hover{filter:brightness(1.06)}
.bell{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;position:relative;color:var(--ink2);font-size:15px}
.bell .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid #fff}
.av{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#0f5ea8,#2167a8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

/* SHELL */
.shell{display:flex;height:calc(100vh - 56px)}
.side{width:236px;background:#fff;border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto;flex-shrink:0}
.snav{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--ink2);font-size:12.8px;font-weight:600;margin-bottom:1px;cursor:pointer;transition:.13s;border:1px solid transparent}
.nav .ico{width:18px;text-align:center;font-size:14px;filter:grayscale(.2)}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.active{background:#eaf4ee;color:var(--brand);border-color:#cfe6d8;font-weight:700}
.nav .cnt{margin-left:auto;font-size:10.5px;background:#eef1f6;color:var(--ink2);border-radius:20px;padding:1px 7px;font-weight:700}
.nav.active .cnt{background:#cfe6d8;color:var(--brand)}

.main{flex:1;overflow-y:auto;position:relative}
.wrap{padding:18px 20px 40px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.phead h1{font-size:19px;font-weight:800;letter-spacing:-.2px}
.phead .crumb{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.phead .crumb b{color:var(--brand)}
.seg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--brand);color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand2)}
.kpi.c::before{background:var(--crit)}.kpi.w::before{background:var(--warn)}.kpi.i::before{background:var(--info)}.kpi.g::before{background:var(--gold)}
.kpi .lab{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;min-height:26px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.5px}
.kpi .dlt{font-size:11px;margin-top:5px;font-weight:600;color:var(--ink2)}
.kpi .dlt.up{color:var(--ok)}.kpi .dlt.dn{color:var(--crit)}

/* GRID layouts */
.cols{display:grid;grid-template-columns:1fr 320px;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .ch{padding:13px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card .ch h3{font-size:13.5px;font-weight:700}
.card .ch .sp{margin-left:auto}
.card .cb{padding:14px 15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid transparent}
.chip.ok{background:#e7f5ec;color:var(--ok);border-color:#c4e6d1}
.chip.warn{background:#fdf3e3;color:var(--warn);border-color:#f2dcb4}
.chip.crit{background:#fdeceb;color:var(--crit);border-color:#f4cdc9}
.chip.info{background:#e9f1fa;color:var(--info);border-color:#cadff2}
.chip.neu{background:#eef1f6;color:var(--ink2);border-color:#e0e5ee}
.chip.gold{background:#f7f0df;color:var(--gold);border-color:#e8d9b0}

/* MAP */
.maparea{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(160deg,#eef4f8,#e6eef4);height:560px;border:1px solid var(--line)}
.maparea svg{position:absolute;inset:0;width:100%;height:100%}
.uf{fill:#dfe7ee;stroke:#fff;stroke-width:.6;transition:.2s}
.uf.hl{fill:#cfe0d6}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:11px;box-shadow:var(--shadow);max-width:210px}
.legend .lt{font-weight:700;margin-bottom:7px;font-size:11px}
.lk{display:flex;align-items:center;gap:8px;margin:4px 0}
.lk .sw{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.maptools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:5px}
.mt{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.96);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--shadow);color:var(--ink2)}
.mt:hover{color:var(--brand);border-color:var(--brand2)}
.maplayers{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:11.5px;box-shadow:var(--shadow);max-width:185px}
.maplayers .lt{font-weight:700;margin-bottom:6px}
.ly{display:flex;align-items:center;gap:7px;margin:4px 0;cursor:pointer}
.ly .tog{width:26px;height:15px;border-radius:10px;background:var(--brand2);position:relative;flex-shrink:0}
.ly .tog::after{content:"";position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff}
.ly.off .tog{background:#cbd2dd}.ly.off .tog::after{left:2px;right:auto}
.dot-c{cursor:pointer;transition:.15s}.dot-c:hover{stroke:#1d2433;stroke-width:2}
.mtip{position:absolute;background:#1d2433;color:#fff;font-size:11px;padding:7px 10px;border-radius:7px;pointer-events:none;opacity:0;transition:.12s;z-index:20;max-width:230px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mtip b{color:#fff}.mtip .s{color:#aab4c5;font-size:10px}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12.3px}
thead th{text-align:left;padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line2)}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:#f4f8f5}
tbody tr.sel{background:#eaf4ee}
.qbar{display:inline-block;width:46px;height:6px;border-radius:4px;background:#eef1f6;position:relative;overflow:hidden;vertical-align:middle}
.qbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

/* RIGHT panel */
.rp{display:flex;flex-direction:column;gap:14px}
.detail .dh{padding:14px 15px;border-bottom:1px solid var(--line2)}
.detail .dh .nm{font-size:15px;font-weight:800}
.detail .dh .mt2{font-size:11.5px;color:var(--muted);margin-top:2px}
.score-ring{display:flex;align-items:center;gap:12px;margin:12px 0}
.ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px}
.kv:last-child{border:none}.kv b{font-weight:700}
.act{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.act button{padding:8px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.act button:hover{border-color:var(--brand2);color:var(--brand)}
.act button.full{grid-column:1/3;background:linear-gradient(135deg,#1f6b3b,#2e8b57);color:#fff;border:none}

/* AI panel */
.ai .ach{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line2)}
.ai .orb{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6a3bd1,#0f5ea8);display:flex;align-items:center;justify-content:center;font-size:14px}
.aimsg{margin:11px 15px;padding:11px 12px;background:linear-gradient(180deg,#f3f0fb,#f7f9fc);border:1px solid #e4ddf5;border-radius:10px;font-size:12px;line-height:1.55}
.aimsg b{color:#5a2fb0}
.suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 15px 14px}
.suggest button{font-size:11px;padding:6px 10px;border-radius:20px;border:1px solid #d8d0ee;background:#f7f4fd;color:#5a2fb0;font-weight:600}
.suggest button:hover{background:#efe9fb}

/* agents */
.agent{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line2)}
.agent:last-child{border:none}
.agent .ab{width:30px;height:30px;border-radius:8px;background:#eaf4ee;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.agent .an{font-size:12.3px;font-weight:700;display:flex;align-items:center;gap:7px}
.agent .ad{font-size:11px;color:var(--muted);margin:1px 0 4px}
.agent .ao{font-size:11px;color:var(--brand);font-weight:600;background:#eef7f1;border-radius:6px;padding:4px 7px;display:inline-block}
.stat{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.stat.sb{background:var(--warn)}

/* alerts */
.alert{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:12px}
.alert:last-child{border:none}
.alert .ai2{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.alert .at{font-weight:600}.alert .ax{font-size:10.5px;color:var(--muted)}

/* KANBAN */
.kanban{display:flex;gap:11px;overflow-x:auto;padding-bottom:14px}
.kcol{min-width:226px;flex-shrink:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px}
.kcol .kh{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:4px 6px 9px;color:var(--ink2)}
.kcol .kh .kc{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:0 7px;font-size:10.5px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,30,50,.05);cursor:pointer}
.kcard:hover{border-color:var(--brand2)}
.kcard .kn{font-size:12.3px;font-weight:700;margin-bottom:3px}
.kcard .km{font-size:10.5px;color:var(--muted);margin-bottom:6px}
.kcard .kf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kbadge{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px}

/* FICHA tabs */
.ftabs{display:flex;gap:3px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px}
.ftab{padding:9px 13px;font-size:12.3px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.ftab.on{color:var(--brand);border-bottom-color:var(--brand)}
.ftab:hover{color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{padding:8px 0;border-bottom:1px solid var(--line2)}
.field .fl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.field .fv{font-size:13px;font-weight:600;margin-top:2px}

.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:flex;align-items:center;gap:10px;font-size:12px}
.barrow .bl{width:130px;color:var(--ink2)}
.barrow .bt{flex:1;height:9px;background:#eef1f6;border-radius:5px;overflow:hidden}
.barrow .bt i{display:block;height:100%;border-radius:5px}
.barrow .bn{width:42px;text-align:right;font-weight:700}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 15px 6px}
.tl::before{content:"";position:absolute;left:-18px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand2)}
.tl .tt{font-size:12.3px;font-weight:700}
.tl .td{font-size:11px;color:var(--muted)}
.tl .tx{font-size:11.5px;color:var(--ink2);margin-top:2px}

.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.fstep{padding:7px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink2)}
.fstep.done{background:#eaf4ee;border-color:#cfe6d8;color:var(--brand)}
.fstep.now{background:var(--brand);color:#fff;border:none;box-shadow:0 2px 8px rgba(31,107,59,.3)}
.farrow{color:var(--muted)}

.modlink{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:9px;transition:.15s}
.modlink:hover{border-color:var(--brand2);box-shadow:var(--shadow)}
.modlink .mi{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.modlink .mt3{font-weight:700;font-size:13px}
.modlink .mx{font-size:11px;color:var(--muted)}
.modlink .mflow{margin-left:auto;font-size:10.5px;color:var(--brand);font-weight:700;background:#eef7f1;padding:3px 8px;border-radius:6px}

.hidden{display:none!important}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.secttitle{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
.note{font-size:11.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brand2);border-radius:8px;padding:10px 12px;margin:10px 0}
.dispcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.dispcard .dt{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:8px}
.gridform{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px}
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-size:11px;font-weight:600;color:var(--ink2)}
.ff input,.ff select,.ff textarea{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 11px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink)}
.ff textarea{height:auto;padding:9px 11px;resize:vertical}
.ff.full{grid-column:1/3}
.req{color:var(--crit)}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}}
</style></head>
<body>

<div class="top">
  <div class="brand">
    <div class="logo">IT</div>
    <div><b>INITI</b> <span class="sub">· Infraestrutura Nacional de Inteligência Territorial Indígena</span><br>
    <span class="sub" style="color:var(--brand);font-weight:700">Módulo A2 · Cadastro de Comunidades e Aldeias</span></div>
  </div>
  <div class="search">
    <span class="ic">🔎</span>
    <input placeholder="Buscar comunidade, aldeia, Terra Indígena, etnia, município, UF ou coordenação regional…">
  </div>
  <div class="topbtns">
    <button class="tbtn primary" onclick="openForm()">＋ Nova Comunidade / Aldeia</button>
    <button class="tbtn">⬆ Importar cadastro</button>
    <button class="tbtn">📲 Coleta de campo</button>
    <button class="tbtn">✅ Validar base</button>
    <button class="bell">🔔<span class="dot"></span></button>
    <div class="av">AF</div>
  </div>
</div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

}));

function qcolor(q){return q>=81?'#1f8a4c':q>=61?'#2e8b57':q>=41?'#c77c12':'#c0392b';}
function qclass(q){return q>=81?'validado':q>=61?'adequado':q>=41?'atenção':'crítico';}
function vcolor(v){return v>=80?'#c0392b':v>=60?'#c77c12':v>=40?'#d4a017':'#2e8b57';}
function rcolor(r){return r=='Alto'?'#c0392b':r=='Médio'?'#c77c12':'#2e8b57';}
function sensClass(s){return s=='Alta'?'crit':s=='Média'?'warn':'neu';}
const esc=s=>(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

let selIdx=2, curPage='overview', curTab='resumo';

// counts for nav badges
function navCount(id){
  if(id=='list')return C.length;
  if(id=='valid')return C.reduce((n,c)=>n+(c.pend.length>0?1:0),0);
  if(id=='vuln')return C.filter(c=>c.vuln>=80).length;
  if(id=='dispatch')return 4;
  if(id=='kanban')return C.filter(c=>c.status!='Publicado').length;
  return 0;
}
function renderSide(){
  let h='<div class="snav">Operação cadastral</div>';
  NAV.forEach(n=>{const cnt=navCount(n[0]);
    h+=`<div class="nav ${n[0]==curPage?'active':''}" onclick="go('${n[0]}')">
      <span class="ico">${n[2]}</span><span>${n[1]}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</div>`;
  });
  h+='<div class="snav">Sistema</div>';
  h+=`<div class="nav" onclick="go('config')"><span class="ico">⚙️</span><span>Configurações</span></div>`;
  document.getElementById('side').innerHTML=h;
}
function go(p){curPage=p;renderSide();render();document.querySelector('.main').scrollTop=0;}

/* ===== MAP ===== */
function mapSVG(mode='vuln',pts=C,withTI=true){
  let s='<svg viewBox="0 0 820 820" preserveAspectRatio="xMidYMid meet">';
  for(const u in UF){const hl=pts.some(c=>c.uf==u)?'hl':'';s+=`<path class="uf ${hl}" d="${UF[u]}"></path>`;}
  if(withTI){for(const t in TI){const[x,y]=TI[t];
    s+=`<circle cx="${x}" cy="${y}" r="15" fill="rgba(31,107,59,.10)" stroke="#2e8b57" stroke-width="1.2" stroke-dasharray="3 3"></circle>`;
  }}
  pts.forEach((c,i)=>{
    let col, r=5.5;
    if(mode=='vuln')col=vcolor(c.vuln);
    else if(mode=='quality')col=qcolor(c.q);
    else if(mode=='water')col=rcolor(c.rh);
    else if(mode=='status')col=c.status=='Publicado'?'#1f8a4c':c.status=='Em validação'?'#c77c12':'#2167a8';
    else if(mode=='sens')col=c.sens=='Alta'?'#6a2fb0':c.sens=='Média'?'#9a6b12':'#8a93a6';
    else col=vcolor(c.vuln);
    if(c.oc)r=7;
    const idx=C.indexOf(c);
    s+=`<circle class="dot-c" cx="${c.x}" cy="${c.y}" r="${r}" fill="${col}" stroke="#fff" stroke-width="1.6"
        onclick="selectComm(${idx});event.stopPropagation()"
        onmousemove="tip(event,'${esc(c.nome)}','${esc(c.ti)} · ${c.uf}','Vuln ${c.vuln} · Hídrico ${c.rh} · Score ${c.q}${c.oc?' · ⚠ ocorrência ativa':''}')"
        onmouseleave="untip()"></circle>`;
    if(c.oc)s+=`<circle cx="${c.x}" cy="${c.y}" r="${r+4}" fill="none" stroke="${col}" stroke-width="1" opacity=".5"></circle>`;
  });
  s+='</svg>';return s;
}
function tip(e,t,s,x){const m=document.getElementById('mtip');m.innerHTML=`<b>${t}</b><br><span class="s">${s}</span><br>${x}`;
  m.style.opacity=1;m.style.left=(e.clientX+14)+'px';m.style.top=(e.clientY+10)+'px';}
function untip(){document.getElementById('mtip').style.opacity=0;}

function legendHTML(mode){
  const sets={
    vuln:[['#c0392b','Crítica (80+)'],['#c77c12','Alta (60–79)'],['#d4a017','Média (40–59)'],['#2e8b57','Baixa (<40)']],
    quality:[['#1f8a4c','Validado (81+)'],['#2e8b57','Adequado (61–80)'],['#c77c12','Atenção (41–60)'],['#c0392b','Crítico (≤40)']],
    water:[['#c0392b','Risco hídrico alto'],['#c77c12','Médio'],['#2e8b57','Baixo']],
    status:[['#1f8a4c','Publicado'],['#c77c12','Em validação'],['#2167a8','Em produção']],
    sens:[['#6a2fb0','Sensibilidade alta'],['#9a6b12','Média'],['#8a93a6','Baixa']]
  };
  const ttl={vuln:'Vulnerabilidade',quality:'Qualidade cadastral',water:'Segurança hídrica',status:'Status cadastral',sens:'Sensibilidade'};
  let h=`<div class="lt">${ttl[mode]}</div>`;
  sets[mode].forEach(s=>h+=`<div class="lk"><span class="sw" style="background:${s[0]}"></span>${s[1]}</div>`);
  h+=`<div class="lk" style="margin-top:6px;border-top:1px solid var(--line2);padding-top:6px"><span class="sw" style="background:transparent;border:1.5px dashed #2e8b57"></span>Limite de Terra Indígena</div>`;
  return h;
}
