<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terra+ A3 — Catálogo de Dados</title>
<style>:root{--green:#0E7C66;--green-d:#0a5d4c;--blue:#1F6FB2;--gold:#C9A85C;--orange:#E8732A;
--bg:#F4F6F8;--panel:#FFFFFF;--line:#E3E8EE;--ink:#1B2733;--muted:#5B6470;--soft:#8A94A0;
--crit:#D92D20;--high:#E8732A;--med:#E0A100;--low:#0E7C66;
--shadow:0 1px 3px rgba(16,40,60,.06),0 8px 24px rgba(16,40,60,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Inter,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{display:grid;grid-template-columns:225px 1fr;grid-template-rows:54px 1fr;height:100vh;overflow:hidden}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.brand small{display:block;font-weight:500;font-size:9.5px;color:var(--muted)}
.modtag{background:#eef6f3;color:var(--green-d);font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px;border:1px solid #cce7de}
.search{flex:1;max-width:430px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--muted)}
.main{padding:22px 26px;overflow:auto}
.crumb{font-size:11.5px;color:var(--soft);margin-bottom:6px}
h1{font-size:22px;margin-bottom:4px}.sub{color:var(--muted);margin-bottom:16px;font-size:13px}
.rowflex{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.btn{padding:8px 14px;border-radius:9px;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:hover{filter:brightness(.97)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi-v{font-size:25px;font-weight:800;margin:4px 0}.kpi-d{font-size:11.5px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}.tbl tr:hover td{background:var(--bg)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.lnk{color:var(--blue);font-weight:700;font-size:12px}.nowrap{white-space:nowrap}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted);text-align:left;width:100%}
.navitem:hover{background:var(--bg)}.navitem.on{background:#eef6f3;color:var(--green-d)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow-step{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center}
.flow-step .fn{width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:10px}
.farr{color:var(--soft)}
.agent{display:flex;flex-direction:column;padding:9px 0;border-bottom:1px dashed var(--line)}
.agent b{font-size:12.5px;color:var(--blue)}.agent span{font-size:11.5px;color:var(--muted)}
.kanban{display:flex;gap:12px;overflow:auto;padding-bottom:8px}
.kbcol{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:225px;flex:1}
.kbh{font-weight:800;font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kbh .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px}
.kbcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.kbcard b{font-size:12.5px}
.ruleln,.scoreln{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%}
.bar{flex:1;height:8px;background:var(--bg);border-radius:6px;overflow:hidden;max-width:300px}.bar i{display:block;height:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabbar button{padding:8px 12px;border-radius:8px 8px 0 0;font-weight:700;font-size:12px;color:var(--muted)}
.tabbar button.on{background:var(--panel);color:var(--blue);border:1px solid var(--line);border-bottom:2px solid var(--blue)}
.wsteps{display:flex;gap:6px;margin-bottom:16px}
.wsteps div{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--bg);font-size:11px;font-weight:700;color:var(--muted)}
.wsteps div.on{background:var(--blue);color:#fff}.wsteps div.done{background:#eef6f3;color:var(--green-d)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.dl dt{font-size:10.5px;color:var(--muted);text-transform:uppercase;margin-top:10px}.dl dd{font-size:13px;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;font-weight:600;opacity:0;transition:.3s;z-index:200}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.ovl{position:fixed;inset:0;background:rgba(16,30,40,.45);display:grid;place-items:center;z-index:100}
.dlg{background:#fff;border-radius:14px;padding:22px;max-width:520px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}</style></head><body>
<div class="app">
 <div class="topbar">
   <div class="brand"><div class="logo">T+</div><div>TERRA+ <small>Catálogo de Dados</small></div></div>
   <span class="modtag">MÓDULO A3</span>
   <div class="search"><span>🔎</span><input style="border:none;background:none;outline:none;flex:1;font:inherit" placeholder="Buscar em Catálogo..."></div>
 </div>
 <nav class="sidebar" id="sb"></nav>
 <main class="main" id="main"></main>
</div>
<div id="toast" class="toast"></div>
<script>const MOD={"code": "A3", "name": "Catálogo de Dados", "short": "Catálogo", "entity": "conjunto de dados", "nav": [{"id": "overview", "icon": "🏠", "label": "Visão Geral"}, {"id": "list", "icon": "📋", "label": "Registros"}, {"id": "kanban", "icon": "🗂️", "label": "Produção"}, {"id": "valid", "icon": "✅", "label": "Qualidade"}], "desc": "Catálogo de metadados (padrão DCAT / ISO 19115) dos dados geoespaciais e tabulares da INITI.", "statusColors": {"Publicado": "#0E7C66", "Em curadoria": "#E0A100", "Rascunho": "#8A94A0"}, "kanban": ["Rascunho", "Em curadoria", "Publicado"], "kpis": [{"l": "Conjuntos", "v": "427", "d": "+12", "up": 1}, {"l": "Publicados", "v": "318", "d": "74%", "up": 1}, {"l": "Temas", "v": "9", "d": "INSPIRE", "up": 1}, {"l": "APIs OGC", "v": "56", "d": "ativas", "up": 1}], "flow": ["Cadastro de metadados", "Curadoria", "Validação de qualidade", "Publicação", "Versionamento"], "cols": [{"h": "Conjunto de dados", "k": "dataset"}, {"h": "Tema", "k": "tema"}, {"h": "Formato", "k": "formato"}, {"h": "Atualização", "k": "atualiz"}, {"h": "Órgão", "k": "orgao"}, {"h": "Status", "k": "status"}], "agents": [{"n": "AgentMeta", "d": "Completa metadados ISO 19115 automaticamente"}, {"n": "AgentDCAT", "d": "Gera ficha DCAT-AP para dados abertos"}, {"n": "AgentLinhagem", "d": "Rastreia proveniência e linhagem"}, {"n": "AgentSchema", "d": "Valida esquema e tipos de campos"}], "formSteps": [{"t": "Identificação", "fields": [{"l": "Nome do conjunto", "k": "dataset", "full": 1}, {"l": "Tema", "k": "tema", "t": "select", "o": ["Fundiário", "Demografia", "Ambiental", "Saúde", "Educação"]}, {"l": "Órgão fonte", "k": "orgao"}]}, {"t": "Técnico", "fields": [{"l": "Formato", "k": "formato", "t": "select", "o": ["Shapefile", "GeoJSON", "CSV", "WMS", "WFS", "GeoPackage"]}, {"l": "Frequência", "k": "atualiz", "t": "select", "o": ["Diária", "Mensal", "Trimestral", "Anual", "Eventual"]}, {"l": "Sistema de referência", "k": "srs", "t": "select", "o": ["SIRGAS 2000", "WGS84"]}, {"l": "Cobertura", "k": "cob", "t": "select", "o": ["Nacional", "Estadual", "Local"]}]}, {"t": "Licença & acesso", "fields": [{"l": "Licença", "k": "lic", "t": "select", "o": ["CC-BY 4.0", "CC0", "Restrito"]}, {"l": "Endpoint / URL", "k": "url", "full": 1}, {"l": "Descrição", "k": "obs", "t": "textarea", "full": 1}]}, {"t": "Revisão", "fields": [{"l": "Curador responsável", "k": "resp"}, {"l": "Status", "k": "status", "t": "select", "o": ["Rascunho", "Em curadoria", "Publicado"]}]}], "fichaTabs": [{"t": "Metadados", "dl": [["Conjunto", "dataset"], ["Tema", "tema"], ["Órgão", "orgao"], ["Status", "status"]]}, {"t": "Técnico", "dl": [["Formato", "formato"], ["Atualização", "atualiz"]]}, {"t": "Linhagem", "txt": "Proveniência, transformações e fontes originais rastreadas."}, {"t": "Acesso & API", "txt": "Endpoints OGC (WMS/WFS) e ficha DCAT-AP para o portal de dados abertos."}, {"t": "Versões", "txt": "Histórico de versões e changelog do conjunto."}], "rules": [{"n": "Metadados ISO 19115 completos", "ok": 1, "s": "OK"}, {"n": "SRS declarado (SIRGAS/WGS84)", "ok": 1, "s": "OK"}, {"n": "Endpoint OGC responde", "ok": 0, "s": "1 falha"}, {"n": "Licença declarada", "ok": 1, "s": "OK"}]};
let DATA=[{"dataset": "Limites de TIs (oficial)", "tema": "Fundiário", "formato": "Shapefile", "atualiz": "Mensal", "orgao": "FUNAI", "status": "Publicado"}, {"dataset": "Densidade demográfica indígena", "tema": "Demografia", "formato": "GeoJSON", "atualiz": "Anual", "orgao": "IBGE", "status": "Publicado"}, {"dataset": "Desmatamento PRODES em TIs", "tema": "Ambiental", "formato": "WMS", "atualiz": "Anual", "orgao": "INPE", "status": "Em curadoria"}, {"dataset": "Saúde indígena (DSEI)", "tema": "Saúde", "formato": "CSV", "atualiz": "Trimestral", "orgao": "SESAI", "status": "Em curadoria"}, {"dataset": "Sobreposição com UCs", "tema": "Fundiário", "formato": "Shapefile", "atualiz": "Eventual", "orgao": "ICMBio", "status": "Rascunho"}, {"dataset": "Focos de calor (queimadas)", "tema": "Ambiental", "formato": "WFS", "atualiz": "Diária", "orgao": "INPE", "status": "Publicado"}].map((r,i)=>({...r,_id:i+1}));
let page='overview', seq=DATA.length, fstep=1, draft={}, fichaTab=0, current=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function badge(s){const m=MOD.statusColors[s]||'#5B6470';return '<span class="pill" style="background:'+m+'22;color:'+m+';border:1px solid '+m+'55">'+s+'</span>';}
function go(p){page=p;current=null;render();}
function renderSB(){document.getElementById('sb').innerHTML=MOD.nav.map(n=>'<button class="navitem'+(page===n.id?' on':'')+'" onclick="go(\''+n.id+'\')"><span>'+n.icon+'</span>'+n.label+'</button>').join('')+'<div style="margin-top:auto;padding:12px;font-size:10.5px;color:var(--soft)">TERRA+ · '+MOD.code+'<br>v1.0 · '+DATA.length+' registros</div>';}
function kpis(){return '<div class="kpis">'+MOD.kpis.map(k=>'<div class="kpi"><div class="kpi-l">'+k.l+'</div><div class="kpi-v">'+k.v+'</div><div class="kpi-d" style="color:'+(k.up?'var(--low)':'var(--high)')+'">'+k.d+'</div></div>').join('')+'</div>';}
function miniTable(rows){return '<table class="tbl"><thead><tr>'+MOD.cols.map(c=>'<th>'+c.h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+MOD.cols.map(c=>'<td>'+(c.k==='status'?badge(r[c.k]):(r[c.k]??'—'))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
function pageOverview(){return '<div class="crumb">Início › Visão Geral</div><h1>'+MOD.name+'</h1><p class="sub">'+MOD.desc+'</p>'+kpis()+'<div class="card"><h3>Fluxo do módulo</h3><div class="flow">'+MOD.flow.map((f,i)=>'<div class="flow-step"><span class="fn">'+(i+1)+'</span>'+f+'</div>').join('<span class="farr">→</span>')+'</div></div><div class="grid2"><div class="card"><h3>Registros recentes</h3>'+miniTable(DATA.slice(0,5))+'</div><div class="card"><h3>Agentes de IA</h3>'+MOD.agents.map(a=>'<div class="agent"><b>'+a.n+'</b><span>'+a.d+'</span></div>').join('')+'</div></div>';}
function pageList(){return '<div class="crumb">'+MOD.short+' › Registros</div><div class="rowflex"><h1>Registros</h1><button class="btn primary" onclick="openNew()">＋ Novo</button></div><div class="card"><table class="tbl"><thead><tr>'+MOD.cols.map(c=>'<th>'+c.h+'</th>').join('')+'<th>Ações</th></tr></thead><tbody>'+DATA.map(r=>'<tr>'+MOD.cols.map(c=>'<td>'+(c.k==='status'?badge(r[c.k]):(r[c.k]??'—'))+'</td>').join('')+'<td class="nowrap"><button class="lnk" onclick="openFicha('+r._id+')">Abrir</button> · <button class="lnk" onclick="openEdit('+r._id+')">Editar</button></td></tr>').join('')+'</tbody></table></div>';}
function pageKanban(){return '<div class="crumb">'+MOD.short+' › Produção</div><h1>Kanban de produção</h1><p class="sub">Arraste mentalmente entre as fases — clique para abrir a ficha.</p><div class="kanban">'+MOD.kanban.map(col=>{const items=DATA.filter(r=>r.status===col);return '<div class="kbcol"><div class="kbh">'+col+' <span class="cnt">'+items.length+'</span></div>'+items.map(r=>'<div class="kbcard" onclick="openFicha('+r._id+')"><b>'+r[MOD.cols[0].k]+'</b><div style="font-size:11px;color:var(--muted)">'+(r[MOD.cols[1].k]||'')+'</div></div>').join('')+'</div>';}).join('')+'</div>';}
function pageValid(){return '<div class="crumb">'+MOD.short+' › Qualidade</div><h1>Validação & Qualidade</h1><div class="card"><h3>Regras automáticas</h3>'+MOD.rules.map(r=>'<div class="ruleln"><span class="dot" style="background:'+(r.ok?'var(--low)':'var(--crit)')+'"></span><b>'+r.n+'</b><span style="margin-left:auto;color:var(--muted)">'+r.s+'</span></div>').join('')+'</div><div class="card"><h3>Score de qualidade por registro</h3>'+DATA.map(r=>{const sc=60+((r._id*17)%40);return '<div class="scoreln"><b style="min-width:200px">'+r[MOD.cols[0].k]+'</b><div class="bar"><i style="width:'+sc+'%;background:'+(sc>80?'var(--low)':sc>65?'var(--med)':'var(--crit)')+'"></i></div><span>'+sc+'%</span></div>';}).join('')+'</div>';}
function openNew(){current=null;draft={};fstep=1;page='form';render();}
function openEdit(id){current=DATA.find(r=>r._id===id);draft={...current};fstep=1;page='form';render();}
function fld(f){const v=draft[f.k]??'';let input;if(f.t==='select')input='<select onchange="draft[\''+f.k+'\']=this.value">'+f.o.map(o=>'<option'+(o===v?' selected':'')+'>'+o+'</option>').join('')+'</select>';else if(f.t==='textarea')input='<textarea rows="3" oninput="draft[\''+f.k+'\']=this.value">'+v+'</textarea>';else input='<input value="'+v+'" oninput="draft[\''+f.k+'\']=this.value">';return '<div class="fld"'+(f.full?' style="grid-column:1/3"':'')+'><label>'+f.l+'</label>'+input+'</div>';}
function renderForm(){const steps=MOD.formSteps;const fields=steps[fstep-1].fields.map(f=>fld(f)).join('');document.getElementById('main').innerHTML='<div class="crumb">'+MOD.short+' › '+(current?'Editar registro':'Novo registro')+'</div><h1>'+(current?'Editar — '+(draft[MOD.cols[0].k]||''):'Novo '+MOD.entity)+'</h1><div class="wsteps">'+steps.map((s,i)=>'<div class="'+(i+1===fstep?'on':(i+1<fstep?'done':''))+'">'+(i+1)+'. '+s.t+'</div>').join('')+'</div><div class="card"><h3>'+steps[fstep-1].t+'</h3><div class="fgrid">'+fields+'</div></div><div class="rowflex"><button class="btn" onclick="go(\'list\')">Cancelar</button><div style="margin-left:auto;display:flex;gap:8px">'+(fstep>1?'<button class="btn" onclick="fmove(-1)">← Voltar</button>':'')+(fstep<steps.length?'<button class="btn primary" onclick="fmove(1)">Avançar →</button>':'<button class="btn primary" onclick="saveForm()">💾 Salvar</button>')+'</div></div>';}
function fmove(d){fstep+=d;renderForm();}
function saveForm(){if(current){Object.assign(current,draft);toast('Registro atualizado ✔');}else{seq++;DATA.unshift({...draft,_id:seq,status:draft.status||MOD.kanban[0]});toast('Registro criado ✔');}go('list');}
function openFicha(id){current=DATA.find(r=>r._id===id);fichaTab=0;page='ficha';render();}
function setTab(i){fichaTab=i;renderFicha();}
function fichaBody(t,r){if(t.dl)return '<dl class="dl">'+t.dl.map(p=>'<div><dt>'+p[0]+'</dt><dd>'+(r[p[1]]??'—')+'</dd></div>').join('')+'</dl>';return '<p style="color:var(--muted);font-size:12.5px;line-height:1.7">Seção <b style="color:var(--ink)">'+t.t+'</b> do registro <b style="color:var(--ink)">'+r[MOD.cols[0].k]+'</b>. '+t.txt+'</p>';}
function renderFicha(){const r=current,tabs=MOD.fichaTabs;document.getElementById('main').innerHTML='<div class="crumb">'+MOD.short+' › Registros › '+(r[MOD.cols[0].k])+'</div><div class="rowflex"><h1>'+r[MOD.cols[0].k]+'</h1><div style="margin-left:auto;display:flex;gap:8px"><button class="btn" onclick="openEdit('+r._id+')">✏️ Editar</button><button class="btn primary" onclick="toast(\'Relatório PDF gerado ✔\')">📄 Relatório</button></div></div>'+badge(r.status)+'<div class="tabbar" style="margin-top:14px">'+tabs.map((t,i)=>'<button class="'+(i===fichaTab?'on':'')+'" onclick="setTab('+i+')">'+t.t+'</button>').join('')+'</div><div class="card">'+fichaBody(tabs[fichaTab],r)+'</div>';}
function render(){renderSB();if(page==='form'){renderForm();return;}if(page==='ficha'){renderFicha();return;}const map={overview:pageOverview,list:pageList,kanban:pageKanban,valid:pageValid};document.getElementById('main').innerHTML=(map[page]||pageOverview)();}
render();
</script>
</body></html>
